<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyClaw Lite</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
</script>
<style>
:root{ --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3;
       --text-dim: #8b949e; --user-bg: #2d1b00; --user-border: #f0883e;
       --ai-bg: #1c2128; --accent: #f0883e; --tool-bg: #0a0e14;
       --radius: 8px; --font: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
*{ margin:0; padding:0; box-sizing:border-box; }
body{ background:var(--bg); color:var(--text); font-family:var(--font);
       height:100vh; display:flex; flex-direction:column; overflow:hidden; }
#header{ background:var(--surface); border-bottom:1px solid var(--border);
          padding:12px 20px; display:flex; align-items:center; gap:12px; flex-shrink:0; }
#header h1{ font-size:16px; font-weight:600; }
#header .badge{ font-size:11px; background:#1f6feb33; color:#58a6ff;
                 padding:2px 8px; border-radius:10px; }
#header .skills{ font-size:11px; color:var(--text-dim); }
#messages{ flex:1; overflow-y:auto; padding:16px 20px 8px; display:flex;
            flex-direction:column; gap:12px; scroll-behavior:smooth; }
.msg{ max-width:85%; padding:10px 14px; border-radius:var(--radius);
       line-height:1.6; font-size:14px; }
.msg .meta{ font-size:11px; color:var(--text-dim); margin-bottom:4px; }
.msg.user{ background:var(--user-bg); border:1px solid var(--user-border); align-self:flex-end; }
.msg.assistant{ background:var(--ai-bg); border:1px solid var(--border); align-self:flex-start; }
.msg.assistant .typing::after{ content:'|'; animation:blink .8s step-end infinite; }
@keyframes blink{ 50%{ opacity:0; } }
.tool-block{ background:var(--tool-bg); border:1px solid #1f2a3a;
              border-radius:var(--radius); align-self:stretch;
              max-width:100%; font-size:13px; flex-shrink:0; }
.tool-block .tool-header{ display:flex; align-items:center; gap:6px;
                            padding:6px 10px; background:#10161e; color:#58a6ff;
                            font-size:11px; font-weight:600; border-bottom:1px solid #1f2a3a; }
.tool-block .tool-cmd{ padding:6px 10px; color:#e6edf3;
                         font-family:'Cascadia Code','Consolas',monospace;
                         font-size:12px; white-space:pre-wrap; word-break:break-all;
                         border-bottom:1px solid #1f2a3a; max-height:200px; overflow-y:auto; }
.tool-block .tool-result{ padding:6px 10px; color:#7ee787;
                            font-family:'Cascadia Code','Consolas',monospace;
                            font-size:12px; white-space:pre-wrap; word-break:normal;
                            max-height:400px; min-height:60px; overflow-y:auto; }
.tool-block .tool-result .exiting{ color:var(--text-dim); }
.msg.error{ background:#3d0000; border:1px solid #da3633; align-self:flex-start; }
#input-area{ background:var(--surface); border-top:1px solid var(--border);
              padding:12px 20px 16px; display:flex; gap:8px; align-items:flex-end; flex-shrink:0; }
#input{ flex:1; background:#0d1117; border:1px solid var(--border);
         border-radius:var(--radius); padding:10px 14px; color:var(--text);
         font-family:var(--font); font-size:14px; resize:none; outline:none;
         min-height:42px; max-height:160px; line-height:1.5; }
#input:focus{ border-color:var(--accent); }
#input::placeholder{ color:var(--text-dim); }
#send-btn{ background:var(--accent); color:#0d1117; border:none;
            border-radius:var(--radius); padding:10px 20px; font-size:14px;
            font-weight:600; cursor:pointer; transition:opacity .15s; }
#send-btn:hover{ opacity:.85; }
#send-btn:disabled{ opacity:.4; cursor:not-allowed; }
#messages::-webkit-scrollbar{ width:6px; }
#messages::-webkit-scrollbar-track{ background:transparent; }
#messages::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }
.msg h1,.msg h2,.msg h3,.msg h4{ margin:8px 0 4px; }
.msg h1{ font-size:18px; } .msg h2{ font-size:16px; } .msg h3{ font-size:15px; }
.msg p{ margin:4px 0; }
.msg ul,.msg ol{ margin:4px 0; padding-left:20px; }
.msg code{ background:#2d3748; padding:1px 5px; border-radius:4px;
            font-size:12px; font-family:'Consolas',monospace; }
.msg pre{ background:#161b22; border:1px solid var(--border); border-radius:6px;
           padding:10px; overflow-x:auto; margin:6px 0; }
.msg pre code{ background:none; padding:0; }
.msg blockquote{ border-left:3px solid var(--accent); padding-left:10px;
                  color:var(--text-dim); margin:4px 0; }
.msg table{ border-collapse:collapse; margin:6px 0; font-size:13px; }
.msg th,.msg td{ border:1px solid var(--border); padding:4px 10px; }
.msg th{ background:var(--surface); }
.msg a{ color:#58a6ff; text-decoration:none; }
.msg a:hover{ text-decoration:underline; }
.msg img{ max-width:100%; border-radius:6px; }
</style>
</head>
<body>
<div id="header">
  <h1>PyClaw Lite</h1>
  <span class="badge" id="model-badge">__MODEL__</span>
  <span class="skills" id="skills-label">skills: [__SKILLS__]</span>
</div>
<div id="messages"></div>
<div id="input-area">
  <textarea id="input" rows="1" placeholder="给 PyClaw Lite 发消息...（Enter 发送，Shift+Enter 换行）"></textarea>
  <button id="send-btn">发送</button>
</div>
<script>
const SYSP_STR = __SYSP_RAW__;
const msgs = [{role:'system', content: SYSP_STR}];
let apiToken = localStorage.getItem('pyclaw_lite_token') || '';
// token 配在 pyclaw.json 的 WEBUI_TOKEN，重启服务不会变；这里只是让浏览器记住
function promptToken(){
  apiToken = prompt('需要 token（pyclaw.json 里的 WEBUI_TOKEN）：') || '';
  if(apiToken) localStorage.setItem('pyclaw_lite_token', apiToken);
  return apiToken;
}
const msgArea = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
function ts(){ const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+
         String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+
         String(d.getMinutes()).padStart(2,'0'); }
function scrollBottom(){ requestAnimationFrame(()=>{ msgArea.scrollTop=msgArea.scrollHeight; }); }
function addMsg(cls, html, meta){
  const div=document.createElement('div');
  div.className='msg '+cls;
  if(meta) div.innerHTML='<div class="meta">'+meta+'</div>'+html;
  else div.innerHTML=html;
  msgArea.appendChild(div);
  scrollBottom(); return div; }
function escapeHtml(s){
  const d=document.createElement('div');
  d.textContent=s; return d.innerHTML; }

// === session persistence ===
function saveMessages(){
  try{ localStorage.setItem('pyclaw_lite_msgs', JSON.stringify(msgs.filter(m=>m.role==='user'||m.role==='assistant'))); }catch(e){}
}
function loadMessages(){
  try{
    var saved=localStorage.getItem('pyclaw_lite_msgs');
    if(!saved)return;
    var loaded=JSON.parse(saved);
    for(var m of loaded){
      if(m.role==='user') addMsg('user','<div class="content">'+escapeHtml(m.content)+'</div>','User '+ts());
      else if(m.role==='assistant') addMsg('assistant','<div class="content">'+marked.parse(scrubToolXml(m.content||''))+'</div>','Agent '+ts());
      msgs.push(m);
    }
    scrollBottom();
  }catch(e){}
}

let currentMsgDiv = null;
let currentText = '';
function startAssistantMsg(){
  currentText='';
  const div=document.createElement('div');
  div.className='msg assistant';
  div.innerHTML='<div class="meta">Agent '+ts()+'</div><div class="content typing"></div>';
  msgArea.appendChild(div);
  scrollBottom(); currentMsgDiv=div; return div; }
function scrubToolXml(s){
  // 兜底：后端没解析掉的工具调用 XML 标签，转义成文本，别让 marked 吃标签
  return s.replace(/<\/?(tool_calls|invoke|parameter|result)[^>]*>/g, function(t){
    return t.replace(/</g,'&lt;').replace(/>/g,'&gt;');
  });
}
function appendDelta(text){
  currentText+=text;
  const contentDiv=currentMsgDiv.querySelector('.content');
  if(contentDiv){
    contentDiv.innerHTML=marked.parse(scrubToolXml(currentText));
    contentDiv.classList.remove('typing');
    contentDiv.classList.add('typing');
    scrollBottom(); } }
function finalizeMsg(){
  if(!currentMsgDiv) return;
  const contentDiv=currentMsgDiv.querySelector('.content');
  if(contentDiv){
    contentDiv.innerHTML=marked.parse(scrubToolXml(currentText||'(no response)'));
    contentDiv.classList.remove('typing'); }
  currentMsgDiv=null; currentText=''; }
function setLoading(v){
  input.disabled=v; sendBtn.disabled=v;
  sendBtn.textContent=v?'...':'发送'; }
async function sendMessage(){
  const text=input.value.trim();
  if(!text) return;
  input.value=''; input.style.height='auto';
  msgs.push({role:'user',content:text});
  addMsg('user', '<div class="content">'+escapeHtml(text)+'</div>', 'User '+ts());
  setLoading(true);
  try{
    let resp=await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-Auth-Token':apiToken},
      body:JSON.stringify({messages:msgs.slice(1)})
    });
    if(resp.status===401){
      localStorage.removeItem('pyclaw_lite_token'); apiToken='';
      const t=promptToken();
      if(!t){
        addMsg('error','<div class="content">没有 token，请求被拒绝</div>','Error');
        setLoading(false); return;
      }
      resp=await fetch('/api/chat', {
        method:'POST',
        headers:{'Content-Type':'application/json','X-Auth-Token':apiToken},
        body:JSON.stringify({messages:msgs.slice(1)})
      });
      if(resp.status===401){
        localStorage.removeItem('pyclaw_lite_token'); apiToken='';
        addMsg('error','<div class="content">token 无效（检查 pyclaw.json 的 WEBUI_TOKEN）</div>','Error');
        setLoading(false); return;
      }
    }
    const reader=resp.body.getReader();
    const decoder=new TextDecoder();
    let buf='';
    let hasAssistant=false;
    while(true){
      const {done,value}=await reader.read();
      if(done) break;
      buf+=decoder.decode(value,{stream:true});
      const lines=buf.split('\n');
      buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: ')) continue;
        let ev;
        try{ ev=JSON.parse(line.slice(6)); }catch(e){ continue; }
        switch(ev.type){
          case 'delta':
            if(!hasAssistant){ startAssistantMsg(); hasAssistant=true; }
            appendDelta(ev.text); break;
          case 'tool_call':
            (function(cmd){
              const div=document.createElement('div');
              div.className='tool-block';
              div.innerHTML='<div class="tool-header">Exec</div>'+
                '<div class="tool-cmd">'+escapeHtml(cmd)+'</div>'+
                '<div class="tool-result"><span class="exiting">running...</span></div>';
              msgArea.appendChild(div); scrollBottom(); })(ev.command);
            break;
          case 'tool_result':
            const blocks=msgArea.querySelectorAll('.tool-block');
            const last=blocks[blocks.length-1];
            if(last){ const rd=last.querySelector('.tool-result');
              if(rd) rd.innerHTML=escapeHtml(ev.text||'(done)'); }
            scrollBottom(); break;
          case 'confirm_request':
            (function(ev){
              const allow=confirm('PyClaw 请求执行危险命令：\n\n'+ev.command+'\n\n是否放行？');
              fetch('/api/confirm',{method:'POST',
                headers:{'Content-Type':'application/json','X-Auth-Token':apiToken},
                body:JSON.stringify({id:ev.id,allow:allow})}).catch(function(){});
            })(ev); break;
         case 'assistant':
           if(!hasAssistant){ startAssistantMsg(); hasAssistant=true; }
            currentText=ev.text||'';
            msgs.push({role:'assistant',content:currentText});
            finalizeMsg();
           hasAssistant=false; break;
          case 'error':
            addMsg('error','<div class="content">'+escapeHtml(ev.text)+'</div>','Error'); break;
          case 'done':
            if(hasAssistant) finalizeMsg();
            saveMessages();
            setLoading(false); break;
        } } }
  }catch(e){
    addMsg('error','<div class="content">'+escapeHtml(e.message)+'</div>','Error');
    setLoading(false); } }
sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', e=>{
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMessage(); } });
input.addEventListener('input', ()=>{
  input.style.height='auto';
  input.style.height=Math.min(input.scrollHeight,160)+'px'; });
loadMessages();
</script>
</body>
</html>
